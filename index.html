<!DOCTYPE html>
<html lang="he" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meira's Table | השולחן של מאירה</title>
<meta name="description" content="Meira's Table — a bilingual family recipe collection.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mrotmensch.github.io/meiras-table/">
<meta property="og:title" content="Meira's Table | השולחן של מאירה">
<meta property="og:description" content="Meira's Table — a bilingual family recipe collection.">
<meta property="og:image" content="https://mrotmensch.github.io/meiras-table/hero-image.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4F6EF;
    --card:#FFFCF5;
    --ink:#1D2B21;
    --ink-soft:#5A6B5C;
    --line: rgba(29,43,33,0.14);

    --pine:#2C4A38;

    --olive:#3F6B45;    --olive-soft:#E1EEE1;
    --rust:#B5563A;     --rust-soft:#F4E0D5;
    --mustard:#C68A2E;  --mustard-soft:#F6EAD1;
    --clay:#7C5B3F;     --clay-soft:#EFE3D5;
    --fig:#4A7A6E;      --fig-soft:#E1EDEA;
    --honey:#7A4F63;    --honey-soft:#EEE1E7;
  }

  *{box-sizing:border-box;}

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Assistant', sans-serif;
    line-height:1.5;
  }

  h1,h2,h3,.serif{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:600;
    margin:0;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    height:min(52vh, 420px);
    min-height:280px;
    width:100%;
    overflow:hidden;
    background:#1D2B21 url('hero-image.jpeg') center/cover no-repeat;
  }

  .hero::after{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(12,20,14,0.42);
  }

  .hero-content{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 20px;
  }

  .site-title-he{
    font-size:clamp(2.4rem, 6vw, 3.6rem);
    color:#F7FAF4;
  }

  .hero-tagline{
    margin-top:12px;
    color:#DCE8D8;
    font-size:1rem;
    letter-spacing:0.01em;
  }

  .hero-flourish{
    position:relative;
    width:180px;
    margin:24px auto 0;
  }

  .sprig{
    position:absolute;
    left:50%;
    bottom:100%;
    transform:translateX(-50%);
    width:22px;
    height:22px;
    color:#DCE8D8;
    margin-bottom:-3px;
  }

  .divider{
    width:180px;
    height:14px;
    display:block;
  }

  /* ---------- Sticky nav ---------- */
  nav.topnav{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(244,246,239,0.96);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
  }

  nav.topnav .nav-links{
    display:flex;
    gap:26px;
    flex-wrap:wrap;
    justify-content:center;
  }

  nav.topnav a{
    font-size:0.95rem;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:none;
    padding:4px 2px;
    border-bottom:2px solid transparent;
    transition:color 0.15s ease, border-color 0.15s ease;
    white-space:nowrap;
  }

  nav.topnav a:hover{
    color:var(--ink);
    border-color:var(--pine);
  }

  .lang-toggle{
    display:flex;
    gap:6px;
    border-inline-start:1px solid var(--line);
    padding-inline-start:24px;
    margin-inline-start:4px;
  }

  .lang-toggle button{
    font-family:'Assistant', sans-serif;
    font-size:0.95rem;
    font-weight:600;
    padding:4px 2px;
    border:none;
    border-bottom:2px solid transparent;
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:color 0.15s ease, border-color 0.15s ease;
  }

  .lang-toggle button:hover{
    color:var(--ink);
  }

  .lang-toggle button.active{
    color:var(--ink);
    border-color:var(--pine);
  }

  .search-box input{
    font-family:'Assistant', sans-serif;
    font-size:0.9rem;
    width:150px;
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    padding:4px 2px;
    color:var(--ink);
    transition:border-color 0.15s ease;
  }

  .search-box input:focus{
    outline:none;
    border-color:var(--pine);
  }

  .search-box input::placeholder{
    color:var(--ink-soft);
  }

  @media (max-width:720px){
    nav.topnav{ gap:16px; padding:12px 16px; }
    .lang-toggle{ border-inline-start:none; padding-inline-start:0; margin-inline-start:0; width:100%; justify-content:center; order:-1; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:6px; }
    .search-box{ width:100%; order:-1; }
    .search-box input{ width:100%; }
  }

  @media print{
    nav.topnav, .hero, footer, .back-link{ display:none; }
  }

  /* ---------- Sections ---------- */
  main{
    max-width:1000px;
    margin:0 auto;
    padding:20px 24px 80px;
  }

  section.category{
    padding-top:56px;
    scroll-margin-top:78px;
  }

  .chapter-head{
    display:flex;
    align-items:baseline;
    gap:16px;
    margin-bottom:10px;
  }

  .chapter-num{
    font-size:2.4rem;
    color:var(--pine);
    line-height:1;
  }

  .chapter-title{
    font-size:1.7rem;
  }

  .stitch{
    width:100%;
    height:10px;
    margin:14px 0 26px;
    display:block;
  }

  /* ---------- Card grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:22px 20px;
  }

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-top:none;
    padding:30px 20px 20px;
    cursor:pointer;
    text-align:start;
    color:var(--ink);
    text-decoration:none;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    display:flex;
    flex-direction:column;
    gap:12px;
    min-height:120px;
    width:100%;
    font-family:inherit;
    clip-path:polygon(
      0% 6%, 5% 0%, 10% 5%, 15% 1%, 20% 6%, 25% 1%, 30% 5%, 35% 0%,
      40% 6%, 45% 1%, 50% 5%, 55% 0%, 60% 6%, 65% 1%, 70% 5%, 75% 0%,
      80% 6%, 85% 1%, 90% 5%, 95% 0%, 100% 6%,
      100% 100%, 0% 100%
    );
  }

  .card::before{
    content:'';
    position:absolute;
    top:0;
    inset-inline:0;
    height:9px;
    background:var(--cat, var(--pine));
    pointer-events:none;
  }

  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 22px rgba(29,43,33,0.12);
  }

  .card:focus-visible{
    outline:2px solid var(--pine);
    outline-offset:2px;
  }

  .card-icon{
    position:relative;
    width:26px;
    height:26px;
  }

  .card-title{
    position:relative;
    font-size:1.25rem;
  }

  .empty-note{
    color:var(--ink-soft);
    font-size:0.95rem;
    font-style:italic;
    padding:6px 2px 4px;
  }

  /* ---------- Recipe page ---------- */
  .recipe-page{
    max-width:680px;
    margin:0 auto;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:0.9rem;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:none;
    margin-bottom:20px;
  }

  .back-link:hover{ color:var(--pine); }

  .recipe-photo{
    width:100%;
    max-height:480px;
    object-fit:cover;
    border-radius:4px;
    margin-bottom:24px;
    display:block;
  }

  .recipe-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
  }

  .recipe-icon{ width:30px; height:30px; flex-shrink:0; }

  .recipe-head h2{
    font-size:1.9rem;
  }

  .recipe-body{
    display:grid;
    grid-template-columns:1fr;
    gap:0;
  }

  @media (min-width:640px){
    .recipe-body{
      grid-template-columns:1fr 1fr;
      gap:0 32px;
    }
  }

  .recipe-body h3{
    font-size:1.05rem;
    color:var(--pine);
    margin-top:0;
    margin-bottom:10px;
  }

  .recipe-body ul, .recipe-body ol{
    margin:0;
    padding-inline-start:22px;
  }

  .recipe-body li{
    margin-bottom:8px;
  }

  .recipe-notes{
    grid-column:1 / -1;
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:0.92rem;
    color:var(--ink-soft);
    font-style:italic;
    line-height:1.6;
  }

  .recipe-tags{
    grid-column:1 / -1;
    margin-top:14px;
    font-size:0.85rem;
    color:var(--ink-soft);
  }

  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--ink-soft);
    font-size:0.85rem;
  }

  @media (max-width:480px){
    .recipe-page{ padding:0 4px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <h1 class="site-title-he" id="titleHe" dir="rtl">השולחן של מאירה</h1>
    <p class="hero-tagline" id="heroTagline"></p>
    <div class="hero-flourish">
      <svg class="sprig" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22V8"/>
        <path d="M12 13c0-4 3-6 7-6-1 4-3 6-7 6z"/>
        <path d="M12 9c0-4-3-6-7-6 1 4 3 6 7 6z"/>
      </svg>
      <svg class="divider" viewBox="0 0 180 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 8C15 2 25 2 38 8C51 14 61 14 74 8C87 2 97 2 110 8C123 14 133 14 146 8C159 2 169 2 178 8" stroke="#DCE8D8" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</div>

<nav class="topnav">
  <div class="nav-links" id="navLinks"></div>
  <div class="search-box">
    <input type="search" id="searchInput" aria-label="Search recipes">
  </div>
  <div class="lang-toggle" id="langToggle">
    <button data-lang="en">English</button>
    <button data-lang="he" class="active">עברית</button>
  </div>
</nav>

<main id="main"></main>

<footer id="footerText">Meira's Table — a family recipe collection</footer>

<script>
  const icons = {
    olive: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16c0 6 5 10 11 10s11-4 11-10"/><path d="M5 16h22"/><path d="M12 9c1-2 2-3 2-5"/><path d="M17 9c1-2 1-4 0-6"/></svg>',
    rust: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16c3-5 9-8 14-6 3 1 5 4 4 7-1 2-3 3-5 2-1 0-2-1-1-3"/><path d="M6 16c-1 2-2 3-3 3"/><circle cx="20" cy="13" r="0.8" fill="currentColor" stroke="none"/></svg>',
    mustard: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="10"/><circle cx="16" cy="16" r="4"/></svg>',
    clay: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20c0-7 4-12 10-12s10 5 10 12c0 2-2 3-10 3S6 22 6 20z"/><path d="M12 12v6"/><path d="M20 12v6"/></svg>',
    fig: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 26V13c0-2 1.5-3 3-3s3 1 3 3"/><path d="M11 13c0-3-2-5-2-5" fill="currentColor"/><path d="M20 26V13c0-2 1.5-3 3-3s3 1 3 3"/><path d="M20 13c0-3-2-5-2-5" fill="currentColor"/></svg>',
    honey: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5c4 6 7 10 7 14a7 7 0 0 1-14 0c0-4 3-8 7-14z"/></svg>'
  };

  const categories = [
    { key:'salads-soups',     en:'Salads & Soups',     he:'סלטים ומרקים',      color:'olive'   },
    { key:'fish-meat',        en:'Fish & Meat',        he:'דגים ובשר',         color:'rust'    },
    { key:'sides',            en:'Sides',              he:'תוספות',            color:'mustard' },
    { key:'breads',           en:'Breads',             he:'לחמים',             color:'clay'    },
    { key:'shabbat-morning',  en:'Saturday Morning',   he:'בוקר של שבת',       color:'fig'     },
    { key:'sweet',            en:'Sweet',              he:'מתוק',              color:'honey'   }
  ];

  const tagLabels = {
    vegan: { en:'Vegan', he:'טבעוני' },
    'dairy-free': { en:'Dairy-free', he:'ללא חלב' },
    quick: { en:'Quick', he:'מהיר' },
    passover: { en:'Passover', he:'פסח' }
  };

  let recipes = [];

  function parseRecipeMarkdown(text) {
    const lines = text.split('\n');
    const meta = {};
    let i = 0;
    i++; // opening ---
    while (lines[i] !== '---') {
      const line = lines[i];
      const idx = line.indexOf(':');
      if (idx !== -1) meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
      i++;
    }
    i++; // closing ---

    const sections = {};
    let heading = null;
    let body = [];
    function flush() {
      if (heading) sections[heading] = body;
    }
    for (; i < lines.length; i++) {
      const line = lines[i];
      if (line.startsWith('## ')) {
        flush();
        heading = line.slice(3).trim();
        body = [];
      } else if (line.trim()) {
        body.push(line.trim().replace(/^-\s+/, '').replace(/^\d+\.\s+/, ''));
      }
    }
    flush();

    const tags = (meta.tags || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
    const notesEn = sections['Notes (EN)'];
    const notesHe = sections['Notes (HE)'];

    const recipe = {
      id: meta.id,
      category: meta.category,
      image: meta.image || null,
      tags,
      title: { en: meta.title_en, he: meta.title_he },
      ingredients: { en: sections['Ingredients (EN)'] || [], he: sections['Ingredients (HE)'] || [] },
      steps: { en: sections['Steps (EN)'] || [], he: sections['Steps (HE)'] || [] }
    };
    if (notesEn || notesHe) {
      recipe.notes = { en: (notesEn || []).join(' '), he: (notesHe || []).join(' ') };
    }
    return recipe;
  }

  function buildHaystack(r) {
    const tagText = r.tags.map(t => {
      const lbl = tagLabels[t];
      return lbl ? lbl.en + ' ' + lbl.he : t;
    }).join(' ');
    r._search = [
      r.title.en, r.title.he,
      ...r.ingredients.en, ...r.ingredients.he,
      tagText
    ].join(' ').toLowerCase();
  }

  async function loadRecipes() {
    const manifest = await fetch('recipes/manifest.json').then(res => res.json());
    recipes = await Promise.all(manifest.map(id =>
      fetch(`recipes/${id}.md`).then(res => res.text()).then(parseRecipeMarkdown)
    ));
    recipes.forEach(buildHaystack);
    route();
  }


  const ui = {
    en: {
      ingredients: 'Ingredients',
      steps: 'Steps',
      comingSoon: 'Recipes coming soon.',
      footer: "Meira's Table — a family recipe collection",
      tagline: "Recipes from Meira's kitchen, gathered around one table",
      searchPlaceholder: 'Search recipes…',
      noResults: 'No recipes match your search.',
      tagsLabel: 'Tags:',
      back: '←'
    },
    he: {
      ingredients: 'רשימת מצרכים',
      steps: 'אופן ההכנה',
      comingSoon: 'מתכונים בקרוב.',
      footer: 'השולחן של מאירה — אוסף מתכוני משפחה',
      tagline: 'מתכונים מהמטבח של מאירה, סביב שולחן אחד',
      searchPlaceholder: 'חיפוש מתכונים…',
      noResults: 'לא נמצאו מתכונים.',
      tagsLabel: 'תגיות:',
      back: '→'
    }
  };

  let lang = 'he';
  let searchQuery = '';

  const htmlRoot = document.getElementById('htmlRoot');
  const navLinks = document.getElementById('navLinks');
  const main = document.getElementById('main');
  const footerText = document.getElementById('footerText');
  const heroTagline = document.getElementById('heroTagline');
  const searchInput = document.getElementById('searchInput');

  function stitchSVG(color){
    return `<svg width="100%" height="10" preserveAspectRatio="none"><line x1="0" y1="5" x2="100%" y2="5" stroke="${color}" stroke-width="1.5" stroke-dasharray="1,7" stroke-linecap="round"/></svg>`;
  }

  function syncChrome() {
    const dir = lang === 'he' ? 'rtl' : 'ltr';
    htmlRoot.setAttribute('dir', dir);
    htmlRoot.setAttribute('lang', lang);

    document.querySelectorAll('.lang-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });

    footerText.textContent = ui[lang].footer;
    heroTagline.textContent = ui[lang].tagline;
    searchInput.placeholder = ui[lang].searchPlaceholder;

    navLinks.innerHTML = categories.map(c =>
      `<a href="#${c.key}">${c[lang]}</a>`
    ).join('');
  }

  function render() {
    syncChrome();
    document.title = "Meira's Table | השולחן של מאירה";

    const q = searchQuery.trim().toLowerCase();
    const filtered = q ? recipes.filter(r => r._search.includes(q)) : recipes;

    if (q && filtered.length === 0) {
      main.innerHTML = `<div class="empty-note">${ui[lang].noResults}</div>`;
      return;
    }

    main.innerHTML = categories.map((c, i) => {
      const recs = filtered.filter(r => r.category === c.key);
      if (q && recs.length === 0) return '';
      const body = recs.length
        ? `<div class="grid">${recs.map(r => cardHTML(r)).join('')}</div>`
        : `<div class="empty-note">${ui[lang].comingSoon}</div>`;
      return `
        <section class="category" id="${c.key}">
          <div class="chapter-head">
            <span class="chapter-num serif">${i + 1}</span>
            <h2 class="chapter-title serif">${c[lang]}</h2>
          </div>
          <div class="stitch">${stitchSVG('var(--' + c.color + ')')}</div>
          ${body}
        </section>
      `;
    }).join('');
  }

  function cardHTML(r) {
    const cat = categories.find(c => c.key === r.category);
    return `
      <a class="card" href="#recipe/${r.id}" style="--cat:var(--${cat.color});">
        <span class="card-icon" style="color:var(--${cat.color});">${icons[cat.color]}</span>
        <div class="card-title serif">${r.title[lang]}</div>
      </a>
    `;
  }

  function renderRecipePage(id) {
    const r = recipes.find(x => x.id === id);
    if (!r) { location.hash = ''; return; }
    const cat = categories.find(c => c.key === r.category);

    syncChrome();
    document.title = `${r.title[lang]} — Meira's Table`;

    const photoHTML = r.image ? `<img class="recipe-photo" src="recipes/images/${r.image}" alt="${r.title[lang]}">` : '';
    const notesHTML = r.notes ? `<div class="recipe-notes">${r.notes[lang]}</div>` : '';
    const tagsHTML = r.tags.length
      ? `<div class="recipe-tags">${ui[lang].tagsLabel} ${r.tags.map(t => (tagLabels[t] ? tagLabels[t][lang] : t)).join(' · ')}</div>`
      : '';

    main.innerHTML = `
      <div class="recipe-page">
        <a class="back-link" href="#${cat.key}">${ui[lang].back} ${cat[lang]}</a>
        ${photoHTML}
        <div class="recipe-head">
          <span class="recipe-icon" style="color:var(--${cat.color});">${icons[cat.color]}</span>
          <h2 class="serif">${r.title[lang]}</h2>
        </div>
        <div class="recipe-body">
          <div>
            <h3>${ui[lang].ingredients}</h3>
            <ul>${r.ingredients[lang].map(i => `<li>${i}</li>`).join('')}</ul>
          </div>
          <div>
            <h3>${ui[lang].steps}</h3>
            <ol>${r.steps[lang].map(s => `<li>${s}</li>`).join('')}</ol>
          </div>
          ${notesHTML}
          ${tagsHTML}
        </div>
      </div>
    `;
  }

  function route() {
    const hash = location.hash;
    if (hash.startsWith('#recipe/')) {
      renderRecipePage(decodeURIComponent(hash.slice('#recipe/'.length)));
    } else {
      render();
      if (hash) {
        const target = document.querySelector(hash);
        if (target) target.scrollIntoView();
      }
    }
  }

  window.addEventListener('hashchange', route);

  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    if (location.hash.startsWith('#recipe/')) {
      location.hash = '';
    } else {
      render();
    }
  });

  document.getElementById('langToggle').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    lang = e.target.dataset.lang;
    route();
  });

  loadRecipes();
</script>

</body>
