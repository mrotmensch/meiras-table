<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meira's Table | השולחן של מאירה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4F6EF;
    --card:#FFFFFF;
    --ink:#1D2B21;
    --ink-soft:#5A6B5C;
    --line: rgba(29,43,33,0.14);

    --pine:#2C4A38;

    --olive:#3F6B45;    --olive-soft:#E1EEE1;
    --rust:#B5563A;     --rust-soft:#F4E0D5;
    --mustard:#C68A2E;  --mustard-soft:#F6EAD1;
    --clay:#7C5B3F;     --clay-soft:#EFE3D5;
    --fig:#4A7A6E;      --fig-soft:#E1EDEA;
    --honey:#7A4F63;    --honey-soft:#EEE1E7;
  }

  *{box-sizing:border-box;}

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Assistant', sans-serif;
    line-height:1.5;
  }

  h1,h2,h3,.serif{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:600;
    margin:0;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    height:min(52vh, 420px);
    min-height:280px;
    width:100%;
    overflow:hidden;
    background:#1D2B21 url('hero-image.jpeg') center/cover no-repeat;
  }

  .hero::after{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(12,20,14,0.42);
  }

  .hero-content{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 20px;
  }

  .site-title-en{
    font-size:clamp(2.4rem, 6vw, 3.6rem);
    color:#F7FAF4;
  }

  .site-title-he{
    font-size:clamp(1.2rem, 3vw, 1.6rem);
    color:#DCE8D8;
    margin-top:8px;
  }

  .divider{
    width:180px;
    height:14px;
    margin:22px auto 0;
    display:block;
  }

  /* ---------- Sticky nav ---------- */
  nav.topnav{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(244,246,239,0.96);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
  }

  nav.topnav .nav-links{
    display:flex;
    gap:26px;
    flex-wrap:wrap;
    justify-content:center;
  }

  nav.topnav a{
    font-size:0.95rem;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:none;
    padding:4px 2px;
    border-bottom:2px solid transparent;
    transition:color 0.15s ease, border-color 0.15s ease;
    white-space:nowrap;
  }

  nav.topnav a:hover{
    color:var(--ink);
    border-color:var(--pine);
  }

  .lang-toggle{
    display:flex;
    gap:6px;
    border-inline-start:1px solid var(--line);
    padding-inline-start:24px;
    margin-inline-start:4px;
  }

  .lang-toggle button{
    font-family:'Assistant', sans-serif;
    font-size:0.88rem;
    font-weight:600;
    padding:6px 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .lang-toggle button.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--cream);
  }

  @media (max-width:720px){
    nav.topnav{ gap:16px; padding:12px 16px; }
    .lang-toggle{ border-inline-start:none; padding-inline-start:0; margin-inline-start:0; width:100%; justify-content:center; order:-1; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  }

  /* ---------- Sections ---------- */
  main{
    max-width:1000px;
    margin:0 auto;
    padding:20px 24px 80px;
  }

  section.category{
    padding-top:56px;
    scroll-margin-top:78px;
  }

  .chapter-head{
    display:flex;
    align-items:baseline;
    gap:16px;
    margin-bottom:10px;
  }

  .chapter-num{
    font-size:2.4rem;
    color:var(--pine);
    line-height:1;
  }

  .chapter-title{
    font-size:1.7rem;
  }

  .stitch{
    width:100%;
    height:10px;
    margin:14px 0 26px;
    display:block;
  }

  /* ---------- Card grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:22px 20px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-top:none;
    padding:24px 20px 20px;
    cursor:pointer;
    text-align:start;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    display:flex;
    flex-direction:column;
    gap:12px;
    min-height:120px;
    width:100%;
    font-family:inherit;
    clip-path:polygon(
      0% 6%, 5% 0%, 10% 5%, 15% 1%, 20% 6%, 25% 1%, 30% 5%, 35% 0%,
      40% 6%, 45% 1%, 50% 5%, 55% 0%, 60% 6%, 65% 1%, 70% 5%, 75% 0%,
      80% 6%, 85% 1%, 90% 5%, 95% 0%, 100% 6%,
      100% 100%, 0% 100%
    );
  }

  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 22px rgba(29,43,33,0.1);
  }

  .card:focus-visible{
    outline:2px solid var(--pine);
    outline-offset:2px;
  }

  .card-icon{
    width:26px;
    height:26px;
  }

  .card-title{
    font-size:1.25rem;
  }

  .empty-note{
    color:var(--ink-soft);
    font-size:0.95rem;
    font-style:italic;
    padding:6px 2px 4px;
  }

  /* ---------- Recipe overlay ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(29,43,33,0.45);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
    z-index:30;
  }

  .overlay.open{ display:flex; }

  .sheet{
    background:var(--card);
    max-width:680px;
    width:100%;
    border-radius:8px;
    padding:36px 34px 40px;
    position:relative;
    box-shadow:0 20px 50px rgba(29,43,33,0.25);
  }

  .close-btn{
    position:absolute;
    top:18px;
    inset-inline-end:18px;
    background:transparent;
    border:none;
    font-size:1.4rem;
    color:var(--ink-soft);
    cursor:pointer;
    line-height:1;
    padding:4px 8px;
  }

  .close-btn:hover{ color:var(--ink); }

  .sheet-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
    padding-inline-end:30px;
  }

  .sheet-icon{ width:30px; height:30px; flex-shrink:0; }

  .sheet h2{
    font-size:1.9rem;
  }

  .sheet-body{
    display:grid;
    grid-template-columns:1fr;
    gap:0;
  }

  @media (min-width:640px){
    .sheet-body{
      grid-template-columns:1fr 1fr;
      gap:0 32px;
    }
  }

  .sheet h3{
    font-size:1.05rem;
    color:var(--pine);
    margin-top:0;
    margin-bottom:10px;
  }

  .sheet ul, .sheet ol{
    margin:0;
    padding-inline-start:22px;
  }

  .sheet li{
    margin-bottom:8px;
  }

  .sheet-notes{
    grid-column:1 / -1;
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:0.92rem;
    color:var(--ink-soft);
    font-style:italic;
    line-height:1.6;
  }

  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--ink-soft);
    font-size:0.85rem;
  }

  @media (max-width:480px){
    .sheet{ padding:28px 22px 32px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <h1 class="site-title-en" id="titleEn">Meira's Table</h1>
    <div class="site-title-he" id="titleHe" dir="rtl">השולחן של מאירה</div>
    <svg class="divider" viewBox="0 0 180 14" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 8C15 2 25 2 38 8C51 14 61 14 74 8C87 2 97 2 110 8C123 14 133 14 146 8C159 2 169 2 178 8" stroke="#DCE8D8" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<nav class="topnav">
  <div class="nav-links" id="navLinks"></div>
  <div class="lang-toggle" id="langToggle">
    <button data-lang="en" class="active">English</button>
    <button data-lang="he">עברית</button>
  </div>
</nav>

<main id="main"></main>

<footer id="footerText">Meira's Table — a family recipe collection</footer>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
  const icons = {
    olive: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16c0 6 5 10 11 10s11-4 11-10"/><path d="M5 16h22"/><path d="M12 9c1-2 2-3 2-5"/><path d="M17 9c1-2 1-4 0-6"/></svg>',
    rust: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16c3-5 9-8 14-6 3 1 5 4 4 7-1 2-3 3-5 2-1 0-2-1-1-3"/><path d="M6 16c-1 2-2 3-3 3"/><circle cx="20" cy="13" r="0.8" fill="currentColor" stroke="none"/></svg>',
    mustard: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="10"/><circle cx="16" cy="16" r="4"/></svg>',
    clay: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20c0-7 4-12 10-12s10 5 10 12c0 2-2 3-10 3S6 22 6 20z"/><path d="M12 12v6"/><path d="M20 12v6"/></svg>',
    fig: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 26V13c0-2 1.5-3 3-3s3 1 3 3"/><path d="M11 13c0-3-2-5-2-5" fill="currentColor"/><path d="M20 26V13c0-2 1.5-3 3-3s3 1 3 3"/><path d="M20 13c0-3-2-5-2-5" fill="currentColor"/></svg>',
    honey: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5c4 6 7 10 7 14a7 7 0 0 1-14 0c0-4 3-8 7-14z"/></svg>'
  };

  const categories = [
    { key:'salads-soups',     en:'Salads & Soups',     he:'סלטים ומרקים',      color:'olive'   },
    { key:'fish-meat',        en:'Fish & Meat',        he:'דגים ובשר',         color:'rust'    },
    { key:'sides',            en:'Sides',              he:'תוספות',            color:'mustard' },
    { key:'breads',           en:'Breads',             he:'לחמים',             color:'clay'    },
    { key:'shabbat-morning',  en:'Saturday Morning',   he:'בוקר של שבת',       color:'fig'     },
    { key:'sweet',            en:'Sweet',              he:'מתוק',              color:'honey'   }
  ];

  const recipes = [
  {
    "id": "tomato-salad",
    "category": "salads-soups",
    "title": {
      "en": "Spicy Tomato Salad",
      "he": "סלט עגבניות חריף"
    },
    "ingredients": {
      "en": [
        "3-4 ripe, peeled red tomatoes (Roma or garden variety)",
        "1 hot green pepper",
        "4 cloves garlic, chopped",
        "½ cup chopped cilantro",
        "1 tsp ground white pepper",
        "½ cup olive oil",
        "Salt"
      ],
      "he": [
        "3-4 עגבניות אדומות מזן תמר או עגבניות שטח בשלות וקלופות",
        "1 פלפל ירוק חריף",
        "4 שיני שום קצוצות",
        "½ כוס כוסברה קצוצה",
        "1 כפית פלפל לבן גרוס",
        "½ כוס שמן זית",
        "מלח"
      ]
    },
    "steps": {
      "en": [
        "Halve the tomatoes and dice each half. Place in a bowl.",
        "Halve the green pepper lengthwise, remove the seeds, and chop finely. Add to the bowl.",
        "Add the remaining ingredients, mix well, and serve."
      ],
      "he": [
        "חוצים את העגבניות וחותכים כל מחצית לקוביות. מניחים בקערה.",
        "חוצים את הפלפל הירוק לאורכו, מסלקים את הזרעים וקוצצים דק. מוסיפים לקערה.",
        "מוסיפים את שאר המרכיבים, מערבבים היטב ומגישים."
      ]
    }
  },
  {
    "id": "cauliflower-salad",
    "category": "salads-soups",
    "title": {
      "en": "Cauliflower Salad",
      "he": "סלט כרובית"
    },
    "ingredients": {
      "en": [
        "1 small cauliflower, coarsely grated",
        "1/2 bunch parsley, chopped",
        "1/2 bunch cilantro, chopped",
        "Walnuts, pecans, or any nuts/seeds you like",
        "Cranberries",
        "— Dressing —",
        "1/4 cup olive oil",
        "1/8 cup lemon juice",
        "2 tbsp honey or maple syrup",
        "Salt"
      ],
      "he": [
        "1 כרובית קטנה מגורדת בפומפייה גסה",
        "1/2 חבילה פטרוזיליה קצוצה",
        "1/2 כוסברה קצוצה",
        "אגוזי מלך, פקאן, או גרעינים מכל סוג שרוצים",
        "חמוציות",
        "— רוטב —",
        "1/4 כוס שמן זית",
        "1/8 כוס מיץ לימון",
        "2 כפות דבש או מייפל",
        "מלח"
      ]
    },
    "steps": {
      "en": [
        "Coarsely grate the cauliflower.",
        "Chop the parsley and cilantro. Toast and chop the nuts.",
        "Prepare the dressing and mix everything together."
      ],
      "he": [
        "מגרדים את הכרובית בפומפייה גסה.",
        "קוצצים פטרוזיליה וכוסברה. קולים וקוצצים את האגוזים.",
        "מכינים את הרוטב ומערבבים הכל יחד."
      ]
    }
  },
  {
    "id": "chopped-liver",
    "category": "fish-meat",
    "title": {
      "en": "Chopped Liver",
      "he": "כבד קצוץ"
    },
    "ingredients": {
      "en": [
        "500g chicken liver",
        "3 large onions",
        "5 hard-boiled eggs"
      ],
      "he": [
        "500 גרם כבד עוף",
        "3 בצלים גדולים",
        "5 ביצים קשות"
      ]
    },
    "steps": {
      "en": [
        "Prepare the hard-boiled eggs.",
        "Chop the onion and fry until caramelized.",
        "Add the liver and fry together until medium doneness; season with salt and pepper. Don't over-season — you can adjust after grinding.",
        "Grind everything together in a meat grinder, including the residual sauce left in the pan."
      ],
      "he": [
        "מכינים ביצים קשות.",
        "קוצצים את הבצל ומטגנים עד לקירמול.",
        "מוסיפים את הכבד ומטגנים ביחד לרמת מדיום, מתבלים במלח ופלפל. לא לשים יותר מדי — ניתן לאזן גם אחרי הטחינה.",
        "טוחנים את הכל במכונת בשר, כולל הרוטב שנשאר במחבת."
      ]
    }
  },
  {
    "id": "caprese-salad",
    "category": "salads-soups",
    "title": {
      "en": "Caprese Salad",
      "he": "סלט קפרזה"
    },
    "ingredients": {
      "en": [
        "Marinated artichoke hearts",
        "Toasted bread cubes",
        "Fresh mozzarella cheese",
        "Cherry tomatoes",
        "Black olives (optional)",
        "Basil leaves",
        "Olive oil",
        "Salt and pepper",
        "Pesto"
      ],
      "he": [
        "ארטישוק כבוש",
        "קוביות לחם קלויות",
        "גבינת מוצרלה טריה",
        "עגבניות שרי",
        "זיתים שחורים (לא חובה)",
        "עלי בזיליקום",
        "שמן זית",
        "מלח ופלפל",
        "ממרח פסטו"
      ]
    },
    "steps": {

        "Spread the pesto on a wide plate.",
        "On top, arrange the artichoke pieces, cherry tomatoes, toasted bread cubes, and olives.",

        "Drizzle with olive oil and pepper.",
        "Squeeze a tomato over the top."
      ],
      "he": [
        "על צלחת רחבה מורחים את ממרח הפסטו.",
        "מעל מניחים פסיות ארטישוק, עגבניות שרי, קוביות לחם קלויות וזיתים.",
        "קורעים את המוצרלה לחתיכות ומניחים מעל.",
        "שמן זית ופלפל.",
        "סוחטים עגבניה מלמעלה."
      ]
    }
  },
  {
    "id": "papaya-salad",
    "category": "salads-soups",
    "title": {
      "en": "Green Papaya Salad",
      "he": "סלט פפאיה"
    },
    "ingredients": {
      "en": [
        "100g rice noodles",
        "1 green papaya",
        "4 cloves garlic, crushed",
        "1 hot red chili pepper, chopped",
        "1 cup bean sprouts",
        "2 tbsp mint leaves, cut into strips",
        "2 tbsp pad thai sauce",
        "Juice of 2 limes",
        "1 tsp fish sauce",
        "Sugar, to taste (optional)"
      ],
      "he": [
        "100 גר׳ אטריות",

        "Add the bean sprouts and greens.",

        "חורצים את הפפאיה הירוקה לאורך בסכין. בעזרת קולפן חותכים לרצועות דקות.",

    "notes": {

    }
  },
  {
    "id": "cucumber-watermelon-feta",
    "category": "salads-soups",
    "title": {
      "en": "Cucumber, Watermelon and Feta Salad",
      "he": "סלט מלפפונים, אבטיח וגבינת פטה"
    },
    "ingredients": {
      "en": [
        "3 cucumbers",
        "6 cups cubed watermelon",
        "2 tbsp olive oil",
        "2 tbsp balsamic vinegar",
        "1 cup cubed feta cheese (optional)",
        "1/3 cup mint leaves",
        "1 level tsp salt",
        "Black pepper, to taste"
      ],
      "he": [

          <div class="chapter-head">
            <span class="chapter-num serif">${i + 1}</span>
            <h2 class="chapter-title serif">${c[lang]}</h2>
          </div>
          <div class="stitch">${stitchSVG('var(--' + c.color + ')')}</div>
          ${body}
        </section>
      `;
    }).join('');

    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openRecipe(card.dataset.id));
    });
  }

  function cardHTML(r) {
    const cat = categories.find(c => c.key === r.category);
    return `
      <button class="card" data-id="${r.id}">
        <span class="card-icon" style="color:var(--${cat.color});">${icons[cat.color]}</span>
        <div class="card-title serif">${r.title[lang]}</div>
      </button>
    `;
  }

  function openRecipe(id) {
    const r = recipes.find(x => x.id === id);
    const cat = categories.find(c => c.key === r.category);
    const notesHTML = r.notes ? `<div class="sheet-notes">${r.notes[lang]}</div>` : '';
    sheet.innerHTML = `
      <button class="close-btn" aria-label="Close">&times;</button>
      <div class="sheet-head">
        <span class="sheet-icon" style="color:var(--${cat.color});">${icons[cat.color]}</span>
        <h2 class="serif">${r.title[lang]}</h2>
      </div>
      <div class="sheet-body">
        <div>
          <h3>${ui[lang].ingredients}</h3>
          <ul>${r.ingredients[lang].map(i => `<li>${i}</li>`).join('')}</ul>
        </div>
        <div>
          <h3>${ui[lang].steps}</h3>
          <ol>${r.steps[lang].map(s => `<li>${s}</li>`).join('')}</ol>
        </div>
        ${notesHTML}
      </div>
    `;
    sheet.querySelector('.close-btn').addEventListener('click', closeRecipe);
    overlay.classList.add('open');
  }

  function closeRecipe() {
    overlay.classList.remove('open');
  }

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeRecipe();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeRecipe();
  });

  document.getElementById('langToggle').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    lang = e.target.dataset.lang;
    render();
  });

  render();
</script>

</body>
</html>
